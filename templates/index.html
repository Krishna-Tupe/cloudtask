<!doctype html><html><head><meta charset="utf-8"><title>CloudTask</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto}li{margin:6px 0}.done{text-decoration:line-through;color:#888}form{display:inline}</style></head>
<body><h1>☁ CloudTask</h1><p>Served from host: <b>{{ host }}</b></p>
<form method="post" action="/add"><input name="title" placeholder="New task" required> <button>Add</button></form>
<ul>{% for t in tasks %}<li><span class="{{ 'done' if t.done }}">{{ t.title }}</span>
<form method="post" action="/toggle/{{ t.id }}"><button>✓</button></form>
<form method="post" action="/delete/{{ t.id }}"><button>✗</button></form></li>{% endfor %}</ul></body></html>
